name: Stage npm release

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # lets npm Trusted Publishing verify this workflow via OIDC; no NPM_TOKEN needed

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@11 # Trusted Publishing and `npm stage` need a recent npm 11
      - name: Check the release tag matches package.json
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$expected" ]; then
            echo "Release tag $TAG does not match package.json version $expected" >&2
            exit 1
          fi
      - run: npm ci
      # The trusted publisher may only stage: the version goes public after a maintainer
      # approves it with 2FA on npmjs.com (or `npm stage approve <stage-id>`).
      # Runs prepublishOnly first: typecheck + test.
      - run: npm stage publish
